<section>
  <form (submit)="$event.preventDefault()">
    <input
      type="text"
      placeholder="Iragazi hiriaren arabera"
      #inputBilaketa
      [value]="bilaketa()"
      (input)="bilaketa.set(inputBilaketa.value)"
    />
    @if (bilaketa()) {
      <button class="primary" type="button" (click)="garbitu()">Garbitu</button>
    }
  </form>
</section>

<section class="results">
  @for (etxea of iragaziak(); track etxea.id) {
    <app-etxe-txartela [etxea]="etxea" />
  } @empty {
    <p>Ez da etxerik aurkitu hiri horretan.</p>
  }
</section>
